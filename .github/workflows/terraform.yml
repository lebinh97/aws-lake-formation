name: terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: ["dev (903036621622)", "prod (903036621622)"]
      action:
        type: choice
        options: [apply, destroy]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VARS: -var-file=../envs/common.tfvars -var-file=../envs/${{ startsWith(inputs.environment, 'prod') && 'prod' || 'dev' }}.tfvars
  
jobs:
  get_account_id:
    name: Extract AWS account ID
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.x.outputs.env }}
      account_id: ${{ steps.x.outputs.account_id }}
    steps:
      - id: x
        run: |
          IN="${{ inputs.environment }}"            # "dev (903036621622)"
          echo "env=${IN%% *}" >> "$GITHUB_OUTPUT"  # dev
          ID="${IN##*(}"; echo "account_id=${ID%)}" >> "$GITHUB_OUTPUT"  # 903036621622

  oidc:
    name: Log in with OIDC
    needs: get_account_id
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.get_account_id.outputs.account_id }}:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity

  plan:
    name: Terraform plan
    needs: [get_account_id, oidc]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.get_account_id.outputs.account_id }}:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config="bucket=lf-learn-${{ needs.get_account_id.outputs.env }}-tf-state-${{ needs.get_account_id.outputs.account_id }}" -backend-config="region=${{ env.AWS_REGION }}"
      - run: terraform plan ${{ inputs.action == 'destroy' && '-destroy' || '' }} $TF_VARS

  apply:
    name: Terraform apply
    needs: [get_account_id, plan]
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.get_account_id.outputs.account_id }}:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # so $(terraform output -raw ...) returns just the value
      - run: terraform init -backend-config="bucket=lf-learn-${{ needs.get_account_id.outputs.env }}-tf-state-${{ needs.get_account_id.outputs.account_id }}" -backend-config="region=${{ env.AWS_REGION }}"
      - run: terraform apply -auto-approve $TF_VARS

      # Create / evolve Iceberg tables from data-contracts/ via Athena
      - name: Athena tables from data contracts
        working-directory: . # repo root, so the script finds data-contracts/
        run: |
          pip install --quiet boto3
          python3 scripts/athena_ddl.py "$(terraform -chdir=terraform output -raw glue_database_name)" "$(terraform -chdir=terraform output -raw iceberg_bucket)" "$(terraform -chdir=terraform output -raw athena_workgroup)"

  destroy:
    name: Terraform destroy
    needs: [get_account_id, plan]
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.get_account_id.outputs.account_id }}:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config="bucket=lf-learn-${{ needs.get_account_id.outputs.env }}-tf-state-${{ needs.get_account_id.outputs.account_id }}" -backend-config="region=${{ env.AWS_REGION }}"
      - run: terraform destroy -auto-approve $TF_VARS
